name: build

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Check (format, compile, unit and architecture tests)
        run: ./gradlew check build --console=plain
      - uses: actions/upload-artifact@v7
        with:
          name: skyatlaz
          path: build/libs/*.jar
