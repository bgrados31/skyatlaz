name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Check (format, compile, unit and architecture tests)
        run: ./gradlew check build --console=plain
      - uses: actions/upload-artifact@v7
        with:
          name: skyatlaz
          path: build/libs/*.jar

  publish:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: skyatlaz
          path: libs
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" libs/*.jar \
            --draft \
            --generate-notes \
            --title "skyatlaz ${GITHUB_REF_NAME#v}"
